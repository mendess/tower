global:
  scrape_interval:     10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'prometheus-systemd'
    static_configs:
      - targets: ['localhost:9558']

  - job_name: 'prometheus-process'
    static_configs:
      - targets: ['localhost:9256']

  - job_name: 'nginx'
    static_configs:
      - targets: ['localhost:9113', 'localhost:2000']
    metric_relabel_configs:
      - source_labels: [remote_addr]
        regex: '192\.168\.42\.2'
        target_label: eyeball
        replacement: pendrellvale

  - job_name: 'pendrellvale' # node exporter full
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'blind-eternities'
    static_configs:
      - targets: ['localhost:9001']

  - job_name: 'planar-bridge'
    static_configs:
      - targets: ['localhost:9002']

  - job_name: 'grafana'
    static_configs:
      - targets: ['localhost:3000']

  - job_name: 'minecraft'
    static_configs:
      - targets: ['localhost:19565']

  - job_name: 'scraparr'
    static_configs:
      - targets: ['localhost:7100']

  - job_name: 'jellyfin'
    static_configs:
      - targets: ['localhost:8097']

  - job_name: immich_api
    static_configs:
      - targets: ['localhost:8081']

  - job_name: immich_microservices
    static_configs:
      - targets: ['localhost:8082']

  - job_name: wireguard
    static_configs:
      - targets: ['localhost:9586']

  - job_name: cadvisor
    static_configs:
      - targets: ['localhost:1696']
