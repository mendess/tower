services:
  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    user: ${PUID}
    ports:
      - 3000:3000
    volumes:
      - ${DB_DIR}/watch/grafana:/var/lib/grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - 1696:8080
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    user: ${PUID}:${PGID}
    command:
      - serve
    volumes:
      - ${DB_DIR}/watch/ntfy/cache:/var/cache/ntfy
      - ${CONFIG_DIR}/watch/ntfy:/etc/ntfy
    ports:
      - 5666:80
      - 9300:9300
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes
