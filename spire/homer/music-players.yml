    <span style='font-size: 1.5em'>Como usar</span><br>
    Todos vão pedir o endereço do servidor, usa
    <code>https://navidrome.mendess.xyz</code>. O username e a password são as
    mesmas que usas no navidrome.
    <br><span style='font-size: 1.5em'>Permissões</span><br>
    Todos vão pedir a seguinte permissão
    <code>[website] wants to access apps and services on devices connected to your local network</code>.
