    value_template: '{% set sensors = [''sensor.borgmatic_flopy_latest_backup_start'',
      ''sensor.borgmatic_local_latest_backup_start''] %}

      {% set last_week = (utcnow() - timedelta(days=7)) | as_timestamp %}

      {{ sensors|map(''states'')|map(''as_timestamp'')|select("<", last_week)|list|length
