- id: '1771246066484'
  alias: Welcome home
  description: ''
  triggers:
  - trigger: zone.occupancy_detected
    options:
      for: 00:00:00
      zone: zone.home
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: binary_sensor.whispersilk_connected_to_xm5
      state:
      - 'on'
  actions:
  - if:
    - condition: illuminance.is_not_detected
      target:
        entity_id: binary_sensor.daylight
      options:
        behavior: any
        for: 00:00:00
    then:
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.lamp_bedroom
      data: {}
  - if:
    - condition: time
      after: 08:00:00
      before: '23:59:00'
    then:
    - action: script.boot_to_source
      metadata: {}
      data:
        source: PC
        volume: 0.1
  mode: single
- id: '1771331270206'
  alias: Leave home
  description: ''
  triggers:
  - trigger: zone.occupancy_cleared
    options:
      for: 00:00:00
      zone: zone.home
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: notification::tolaria-is-on
    id: turn-off-tolaria
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - turn-off-tolaria
    then:
    - action: switch.turn_off
      metadata: {}
      target:
        entity_id: switch.tolaria
      data: {}
    else:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.aramathinewall_power_button
    - if:
      - condition: state
        entity_id: switch.tolaria
        state:
        - 'on'
      then:
      - action: notify.mobile_app_whispersilk
        metadata: {}
        data:
          title: tolaria on
          message: deixaste o fixo ligado
          data:
            actions:
            - action: notification::tolaria-is-on
              title: Turn off tolaria
  - action: light.turn_off
    metadata: {}
    target:
      area_id: bedroom
    data: {}
  mode: single
- id: '1771934637797'
  alias: Avisar a Andreia <3
  description: ''
  triggers:
  - trigger: battery.level_changed
    target:
      entity_id: sensor.pixel_9a_battery_level
    options:
      threshold:
        type: below
        value:
          active_choice: number
          number: 20
  conditions:
  - condition: zone.not_in_zone
    target:
      entity_id: person.andreia
    options:
      behavior: any
      for: 00:00:00
      zone: zone.home
  actions:
  - action: notify.mobile_app_pixel_9a
    metadata: {}
    data:
      title: Tens pouca bateria no telemovel!
      message: "Se calhar era melhor por a carregar \U0001F917"
  mode: single
- id: '1772244305879'
  alias: Start Gaming Mode
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.gaming_mode
    id: 'on'
    to:
    - 'on'
  - trigger: state
    entity_id:
    - input_boolean.gaming_mode
    to:
    - 'off'
    id: 'off'
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - 'on'
    then:
    - action: script.turn_on_tolaria_w_steam_if_tolaria_is_off
      metadata: {}
      data: {}
    - action: switch.turn_on
      metadata: {}
      target:
        entity_id: switch.aramathinewall_power_button
      data: {}
    - action: switch.turn_on
      metadata: {}
      target:
        entity_id:
        - switch.tv_screen_switch
      data: {}
    - parallel:
      - action: script.notify_tv
        metadata: {}
        data:
          message: waiting for tolaria to boot up
        continue_on_error: true
      - action: shell_command.wait_for_tolaria
        metadata: {}
        data: {}
      alias: wait for tolaria
    - parallel:
      - action: script.notify_tv
        metadata: {}
        data:
          message: waiting for steam to boot up
        continue_on_error: true
      - action: shell_command.tolaria_wait_for_steam
        metadata: {}
        data: {}
      alias: Wait for steam
    - action: script.boot_to_source
      metadata: {}
      data:
        source: PC
    - alias: wait for tolaria to come online
      wait_template: '{{ is_state("switch.tolaria", "on") }}'
      continue_on_timeout: true
      timeout:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - alias: check if tolaria booted up
      if:
      - condition: switch.is_off
        target:
          entity_id: switch.tolaria
        options:
          behavior: any
          for: 00:00:00
      then:
      - action: script.notify_tv
        metadata: {}
        data:
          message: tolaria is still offline
        continue_on_error: true
      - stop: tolaria is still offline
        error: true
    - alias: start steam link
      action: shell_command.host_run
      metadata: {}
      data:
        command: /usr/bin/shyprctl l flatpak run com.valvesoftware.SteamLink --autoconnect
    - alias: fade out music
      parallel:
      - alias: reduce tv volume to 25
        repeat:
          while:
          - condition: numeric_state
            entity_id: media_player.aramanthinewall
            attribute: volume_level
            above: 0.25
          sequence:
          - action: media_player.volume_down
            metadata: {}
            target:
              entity_id: media_player.aramanthinewall
            data: {}
          - delay:
              hours: 0
              minutes: 0
              seconds: 0.5
              milliseconds: 0
      - action: shell_command.host_run
        metadata: {}
        data:
          command: /usr/local/bin/fade-out-music
        alias: Fade out music
    - action: script.adjust_tv_volume
      metadata: {}
      data:
        volume: 0.25
    else:
    - action: shell_command.host_run
      metadata: {}
      data:
        command: /usr/bin/pkill fade-out-music
    - action: media_player.volume_set
      metadata: {}
      target:
        entity_id: media_player.aramanthinewall
      data:
        volume_level: 0.1
    - parallel:
      - action: shell_command.host_run
        metadata: {}
        data:
          command: /usr/local/bin/fade-in-music
        alias: Fade in music
      - action: shell_command.tolaria_restore_resolution
        metadata: {}
        data: {}
      alias: fade in music and restore tolaria resolution
  mode: restart
- id: '1773967837355'
  alias: Screen turns on when tv turns on
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - switch.aramathinewall_power_button
    to:
    - 'on'
    id: 'on'
  - trigger: state
    entity_id:
    - switch.aramathinewall_power_button
    to:
    - 'off'
    id: 'off'
  - trigger: time_pattern
    minutes: '10'
    id: poll
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id:
      - 'off'
      - 'on'
    - condition: switch.is_on
      target:
        entity_id: switch.aramathinewall_power_button
      options:
        behavior: any
        for: 00:00:00
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'on'
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.tv_screen
        data: {}
    - conditions:
      - condition: trigger
        id:
        - 'off'
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.tv_screen
        data: {}
    - conditions:
      - condition: trigger
        id:
        - poll
      sequence:
      - action: webostv.command
        metadata: {}
        data:
          command: com.webos.service.tvpower/power/getPowerState
          entity_id: media_player.aramanthinewall
        response_variable: response
      - if:
        - condition: template
          value_template: '{{ response[''media_player.aramanthinewall''].state ==
            ''Screen Off'' }}'
          alias: screen is off
        then:
        - action: input_boolean.turn_off
          metadata: {}
          target:
            entity_id: input_boolean.tv_screen
          data: {}
        else:
        - action: input_boolean.turn_on
          metadata: {}
          target:
            entity_id: input_boolean.tv_screen
          data: {}
  mode: restart
- id: '1775574119677'
