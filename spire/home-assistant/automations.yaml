- id: '1781087126490'
  alias: Pilula alert
  description: ''
  triggers:
  - trigger: time
    at: '22:00:00'
    id: antibabypillen
  - trigger: time
    at: 08:00:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    id: heart
  - trigger: time
    at: 09:00:00
    id: heart
    weekday:
    - sun
    - sat
  - trigger: counter.maximum_reached
    target:
      entity_id: counter.antibabypillen_counter
    options:
      behavior: each
      for: 00:00:00
    id: counter reset
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - counter reset
    then:
    - action: counter.reset
      metadata: {}
      target:
        entity_id: counter.antibabypillen_counter
      data: {}
    - stop: done
    alias: Reset counter
  - alias: Increment Antibabypillen counter
    if:
    - condition: trigger
      id:
      - antibabypillen
    then:
    - action: counter.increment
      metadata: {}
      target:
        entity_id: counter.antibabypillen_counter
      data: {}
    - alias: Stop if doing pill interval
      condition: counter.is_value
      options:
        threshold:
          type: above
          value:
            active_choice: number
            number: 22
      target:
        entity_id: counter.antibabypillen_counter
  - variables:
      message: '{%- if trigger.id == "heart" %} Protect your heart {%- elif trigger.id
        == "antibabypillen" %} Antibabypillen {{ states("counter.antibabypillen_counter")}}:
        Vai tomar isso {%- else %} You need to take some meds, but I don''t know which
        {%- endif %}'
    enabled: false
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.antibabipillen
    data: {}
  - wait_for_trigger:
    - trigger: switch.turned_off
      target:
        entity_id: input_boolean.antibabipillen
      options:
        behavior: each
        for: 00:00:00
    timeout:
      hours: 1
      minutes: 0
      seconds: 0
      milliseconds: 0
    enabled: false
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.antibabipillen
        state:
        - 'on'
      sequence:
      - if:
        - condition: state
          entity_id: switch.aramathinewall_power_button
          state:
          - 'on'
        - condition: zone.in_zone
          target:
            entity_id: person.andreia
          options:
            for: 00:00:00
            zone: zone.home
        then:
        - action: notify.lg_webos_tv_oled65b46la_deuqljp
          metadata: {}
          data:
            message: '{{ message }}'
        - delay:
            hours: 0
            minutes: 0
            seconds: 7
            milliseconds: 0
        else:
        - action: notify.mobile_app_pixel_9a
          metadata: {}
          data:
            message: '{{ message }}'
        - delay:
            hours: 0
            minutes: 30
            seconds: 0
            milliseconds: 0
    enabled: false
  mode: queued
  max: 10
- id: '1783362865967'
  alias: Update estores
  description: ''
  triggers:
  - trigger: state
    entity_id: input_boolean.sleeping
  - trigger: state
    entity_id: input_boolean.gaming_mode
  - trigger: state
    entity_id: binary_sensor.daylight
  - trigger: state
    entity_id: sensor.sun_solar_azimuth
  - trigger: state
    entity_id: binary_sensor.aramanthinewall_source_is_jellyfin
  - trigger: state
    entity_id: input_boolean.privacy
  - trigger: timer.finished
    target:
      entity_id: timer.cover_grace_period
    options:
      behavior: each
      for: 00:00:00
  - trigger: timer.cancelled
    target:
      entity_id: timer.cover_grace_period
    options:
      for: 00:00:00
  - trigger: door.closed
    target:
      entity_id: binary_sensor.varanda_aberta
    options:
      behavior: each
      for: 00:00:00
  - trigger: state
    entity_id: binary_sensor.oboro
  conditions:
  - condition: timer.is_idle
    target:
      entity_id: timer.cover_grace_period
    options:
      for: 00:00:00
  actions:
  - action: automation.turn_off
    metadata: {}
    target:
      entity_id: automation.start_estores_grace_period
    data:
      stop_actions: true
  - variables:
      azimuth: '{{ int(states(''sensor.sun_solar_azimuth'')) }}'
      lower_target: '{%- set max_temp = states("sensor.max_temp") %}

        {%- set temp = 0 if max_temp == "unknown" else float(max_temp) %}

        {{ 100 if temp < 27 else 30 }}'
      lower_east: '{{ 0 if azimuth < 140 and lower_target < 100 else 100 }}'
      lower_south: '{{ lower_target if 100 < azimuth < 200 else 100 }}'
      lower_west: '{{ lower_target if 150 < azimuth else 100 }}'
      daytime_target: '{{ 0 if states(''binary_sensor.daylight'') == ''off'' else
        100 }}'
      media_target: '{{ 0 if states(''input_boolean.gaming_mode'') == ''on'' or states(''binary_sensor.aramanthinewall_source_is_jellyfin'')
        == ''true'' else 100 }}'
      working_target: '{{ 30 if states(''binary_sensor.oboro'') == ''on'' else 100
        }}'
      sleeping_target: '{{ 0 if states(''input_boolean.sleeping'') == ''on'' else
        100 }}'
      privacy: '{{ 30 if states(''input_boolean.privacy'') == ''on'' else 100 }}'
      calculations:
      - entity: cover.estores_varanda
        motors:
        - sensor.estores_varanda_direira_motor_run_status
        - sensor.estores_varanda_esquerda_motor_run_status
        position: '{{ min(daytime_target, lower_east, media_target, sleeping_target,
          privacy) }}'
      - entity: cover.estores_tv
        motors:
        - sensor.estores_tv_motor_run_status
        position: '{{ min(daytime_target, lower_south, media_target, sleeping_target,
          privacy) }}'
      - entity: cover.estores_wc
        motors:
        - sensor.estores_wc_motor_run_status
        position: '{{ min(daytime_target, lower_south, sleeping_target) }}'
      - entity: cover.estores_quarto
        motors:
        - sensor.estores_quarto_motor_run_status
        position: '{{ min(daytime_target, lower_west, sleeping_target) }}'
      - entity: cover.estores_escritorio
        motors:
        - sensor.estores_escritorio_motor_run_status
        position: '{{ min(working_target, daytime_target, lower_west, sleeping_target)
          }}'
  - repeat:
      for_each: '{{ calculations }}'
      sequence:
      - if:
        - condition: template
          value_template: '{% set current_position = state_attr(repeat.item.entity,
            ''current_position'') %}

            {{ not (repeat.item.position - 5) < current_position < (repeat.item.position
            + 5) }}'
          alias: Not at calculated position
        - condition: or
          conditions:
          - condition: template
            value_template: '{{ repeat.item.entity != ''cover.estores_varanda''}}'
            alias: not varanda
          - condition: door.is_closed
            target:
              entity_id: binary_sensor.varanda_aberta
            options:
              behavior: any
              for: 00:00:00
        then:
        - action: cover.set_cover_position
          metadata: {}
          target:
            entity_id: '{{ repeat.item.entity }}'
          data:
            position: '{{ repeat.item.position }}'
        - delay:
            hours: 0
            minutes: 0
            seconds: 1
            milliseconds: 0
        - alias: Wait for motors to stop
          wait_template: '{{ repeat.item.motors|map(''states'')|select("!=", "Stop")|list
            == [] }}'
          timeout:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
  - action: automation.turn_on
    metadata: {}
    target:
      entity_id: automation.start_estores_grace_period
    data: {}
  mode: restart
