- id: '1784217834462'
  alias: Adjust TV Volume when cooking
  description: ''
  triggers:
  - trigger: power.crossed_threshold
    target:
      entity_id: sensor.extrator_power
    options:
      for: 00:00:00
      threshold:
        type: above
        value:
          active_choice: number
          number: 100
          unit_of_measurement: W
    id: 'on'
  - trigger: power.crossed_threshold
    target:
      entity_id: sensor.extrator_power
    options:
      for: 00:00:00
      threshold:
        type: below
        value:
          active_choice: number
          number: 50
          unit_of_measurement: W
    id: 'off'
  conditions:
  - condition: switch.is_off
    target:
      entity_id: input_boolean.gaming_mode
    options:
      behavior: any
      for: 00:00:00
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.aramanthinewall_source_is_pc
      state:
      - 'on'
    - condition: state
      entity_id: binary_sensor.aramanthinewall_source_is_youtube
      state:
      - 'on'
  actions:
  - action: notify.lg_webos_tv_oled65b46la_deuqljp
    metadata: {}
    data:
      message: '{{ iif(trigger.id == ''on'', "Now we''re cooking!", "Bon apetit")
        }}'
  - action: script.adjust_tv_volume
    metadata: {}
    data:
      volume: '{% set volume = iif(states("binary_sensor.aramanthinewall_source_is_pc")
        == ''on'', [0.1, 0.5], [0.25, 0.75]) %} {{ volume[int(trigger.id == ''on'')]
        }}'
      step_delay: '{{ iif(trigger.id == ''on'', 1, 0.4) }}'
  mode: restart
- id: '1784626905405'
  alias: Start Notification
  description: ''
  triggers:
  - trigger: switch.turned_on
    target:
      label_id: task_alert
    options:
      behavior: each
  conditions: []
  actions:
  - variables:
      table:
        input_boolean.maquina_de_lavar:
          who:
          - person.mendess
          - person.andreia
          text: A maquina de lavar terminou
          time_before_spamming:
            hours: 0
            minutes: 0
            seconds: 0
        input_boolean.antibabipillen:
          who:
          - person.andreia
          text: "{%- if now().hour < 12 %}\n  Protect your heart\n{%- else %}\n  Antibabypillen
            {{ states(\"counter.antibabypillen_counter\")}}: Vai tomar isso\n{%- endif
            %}"
          time_before_spamming:
            hours: 1
            minutes: 0
            seconds: 0
  - variables:
      who: '{{ table[trigger.entity_id].who }}'
      text: '{{ table[trigger.entity_id].text }}'
      time_before_spamming: '{{ table[trigger.entity_id].time_before_spamming }}'
  - variables:
      devices:
        person.mendess: notify.mobile_app_ornithopter
        person.andreia: notify.mobile_app_pixel_9a
  - wait_template: '{{ states(trigger.entity_id) == ''off'' }}'
    timeout:
      hours: '{{time_before_spamming.hours }}'
      minutes: '{{ time_before_spamming.minutes }}'
      seconds: '{{ time_before_spamming.seconds }}'
      milliseconds: 0
  - repeat:
      while:
      - condition: template
        value_template: '{{ states(trigger.entity_id) == ''on'' }}'
      sequence:
      - if:
        - condition: state
          entity_id: switch.aramathinewall_power_button
          state:
          - 'on'
        - condition: template
          value_template: '{{ who|map(''states'')|select("==", "home")|first is defined
            }}'
        then:
        - if:
          - condition: switch.is_off
            target:
              entity_id: switch.tv_screen_switch
            options:
              behavior: any
              for: 00:00:00
          then:
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.tv_screen_switch
            data: {}
        - action: notify.lg_webos_tv_oled65b46la_deuqljp
          metadata: {}
          data:
            message: '{{ text }}'
        - delay:
            hours: 0
            minutes: 0
            seconds: 7
            milliseconds: 0
        else:
        - repeat:
            for_each: '{{ who }}'
            sequence:
            - action: '{{ devices[repeat.item] }}'
              metadata: {}
              data:
                message: '{{ text }}'
        - delay:
            hours: 0
            minutes: 15
            seconds: 0
            milliseconds: 0
  mode: parallel
  max: 10
