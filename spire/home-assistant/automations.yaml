- id: '1784217834462'
  alias: Adjust TV Volume when cooking
  description: ''
  triggers:
  - trigger: power.crossed_threshold
    target:
      entity_id: sensor.extrator_power
    options:
      for: 00:00:00
      threshold:
        type: above
        value:
          active_choice: number
          number: 100
          unit_of_measurement: W
    id: 'on'
  - trigger: power.crossed_threshold
    target:
      entity_id: sensor.extrator_power
    options:
      for: 00:00:00
      threshold:
        type: below
        value:
          active_choice: number
          number: 50
          unit_of_measurement: W
    id: 'off'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.aramanthinewall_source_is_pc
      state:
      - 'on'
    - condition: state
      entity_id: binary_sensor.aramanthinewall_source_is_youtube
      state:
      - 'on'
  actions:
  - wait_template: '{{ is_state(''input_boolean.gaming_mode'', ''off'') }}'
    timeout:
      hours: 1
      minutes: 0
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
  - variables:
      id: '{{ trigger.id }}'
  - action: script.notify_tv
    metadata: {}
    data:
      message: '{{ iif(id == ''on'', "Now we''re cooking!", "Bon apetit") }}'
  - action: script.adjust_tv_volume
    metadata: {}
    data:
      volume: '{% set source_is_pc = int(states("binary_sensor.aramanthinewall_source_is_pc")
        == ''on'') %}

        {% set target_volume = int(id == ''on'') %}

        {% set pc_volumes = [0.1, 0.35] %}

        {% set other_volumes = [0.25, 0.60] %}

        {{ [other_volumes, pc_volumes][source_is_pc][target_volume] }}'
      step_delay: '{{ iif(id == ''on'', 1, 5) }}'
      short_step_delay: '{{ iif(id == ''on'', 0.5, 0.2) }}'
  mode: restart
- id: '1784626905405'
  alias: Start Notification
  description: ''
  triggers:
  - trigger: switch.turned_on
    target:
      label_id: task_alert
    options:
      behavior: each
  conditions: []
  actions:
  - variables:
      table:
        input_boolean.maquina_de_lavar:
          who:
          - person.mendess
          - person.andreia
          text: A maquina de lavar terminou
          time_before_spamming:
            hours: 0
            minutes: 0
            seconds: 0
        input_boolean.antibabipillen:
          who:
          - person.andreia
          text: "{% set msg = [\n   \"Vai tomar isso\",\n   \"Toma a puta da pilula\",\n
            \  \"Toma a pilulazinha amorsinho fofinha linda \U0001F970\U0001F970\",\n
            \  \"Oh mor, ja tomaste o repelente de bebes?\",\n   \"Eish... ainda nao
            tomaste a pilula?.. yikes\",\n   \"É pequena, é redonda, é cor de rosa
            e tens de a tomar\",\n] %}\n{%- if now().hour < 12 %}\n  Protect your
            heart\n{%- else %}\n  Antibabypillen {{ states(\"counter.antibabypillen_counter\")}}:
            {{ msg | shuffle | first }}\n{%- endif %}"
          time_before_spamming:
            hours: 1
            minutes: 0
            seconds: 0
  - variables:
      who: '{{ table[trigger.entity_id].who }}'
      text: '{{ table[trigger.entity_id].text }}'
      time_before_spamming: '{{ table[trigger.entity_id].time_before_spamming }}'
  - variables:
      devices:
        person.mendess: notify.mobile_app_whispersilk
        person.andreia: notify.mobile_app_pixel_9a
  - wait_template: '{{ states(trigger.entity_id) == ''off'' }}'
    timeout:
      hours: '{{time_before_spamming.hours }}'
      minutes: '{{ time_before_spamming.minutes }}'
      seconds: '{{ time_before_spamming.seconds }}'
      milliseconds: 0
  - repeat:
      while:
      - condition: template
        value_template: '{{ states(trigger.entity_id) == ''on'' }}'
      sequence:
      - if:
        - condition: state
          entity_id: switch.aramathinewall_power_button
          state:
          - 'on'
        - condition: template
          value_template: '{{ who|map(''states'')|select("==", "home")|first is defined
            }}'
        then:
        - if:
          - condition: switch.is_off
            target:
              entity_id: switch.tv_screen_switch
            options:
              behavior: any
              for: 00:00:00
          then:
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.tv_screen_switch
            data: {}
        - action: script.notify_tv
          metadata: {}
          data:
            message: '{{ text }}'
        - delay:
            hours: 0
            minutes: 0
            seconds: 7
            milliseconds: 0
        else:
        - repeat:
            for_each: '{{ who }}'
            sequence:
            - action: '{{ devices[repeat.item] }}'
              metadata: {}
              data:
                message: '{{ text }}'
        - delay:
            hours: 0
            minutes: 15
            seconds: 0
            milliseconds: 0
  mode: parallel
  max: 10
