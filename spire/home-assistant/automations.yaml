- id: '1783368297736'
  alias: Start estores grace period
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - cover.estores_quarto_wc
    attribute: current_position
    id: bedroom
  - trigger: state
    entity_id:
    - cover.estores_escritorio
    attribute: current_position
    id: study
  - trigger: state
    entity_id:
    - cover.estores_sala
    attribute: current_position
    id: living room
  conditions:
  - alias: home assistant has been running for 30 seconds
    condition: template
    value_template: '{{ (now() + timedelta(minutes=5)) > states(''sensor.uptime'')
      | as_datetime }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - bedroom
      sequence:
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.cover_grace_period_bedroom
        data: {}
    - conditions:
      - condition: trigger
        id:
        - study
      sequence:
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.cover_grace_period_study
        data: {}
    - conditions:
      - condition: trigger
        id:
        - living room
      sequence:
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.cover_grace_period_living_room
        data: {}
  mode: single
- id: '1783412024155'
  alias: Animate Cover according to alarm events
  description: ''
  triggers:
  - trigger: event.received
    target:
      entity_id: event.sleep_as_android_alarm_clock
    options:
      event_type:
      - alert_start
    id: alarm started
    alias: Alarm Started
  - trigger: event.received
    target:
      entity_id: event.sleep_as_android_alarm_clock
    options:
      event_type:
      - alert_dismiss
    id: alarm dismissed
    alias: Alarm Dismissed
  - trigger: event.received
    target:
      entity_id: event.sleep_as_android_sleep_tracking
    options:
      event_type:
      - resumed
      - started
      - paused
    id: sleep
    alias: Sleep tracking started
  conditions:
  - condition: zone
    entity_id: person.mendess
    zone: zone.home
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - alarm started
      sequence:
      - action: cover.set_cover_position
        metadata: {}
        data:
          position: 10
        target:
          entity_id: cover.estores_quarto_wc
    - conditions:
      - condition: trigger
        id:
        - alarm dismissed
      sequence:
      - if:
        - condition: illuminance.is_not_detected
          target:
            entity_id: binary_sensor.daylight
          options:
            behavior: any
            for: 00:00:00
        then:
        - action: light.turn_on
          metadata: {}
          target:
            device_id: 6b5673131ce27d8189cd8670a200bc01
          data: {}
      - repeat:
          while:
          - condition: numeric_state
            entity_id: cover.estores_quarto_wc
            attribute: current_position
            below: 50
          sequence:
          - action: cover.set_cover_position
            metadata: {}
            target:
              entity_id: cover.estores_quarto_wc
            data:
              position: '{{ min(100, (state_attr(''cover.estores_quarto_wc'', ''current_position'')
                + 10)) }}'
          - delay:
              hours: 0
              minutes: 2
              seconds: 0
              milliseconds: 0
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.sleeping
        data: {}
      - action: timer.cancel
        metadata: {}
        data: {}
        target:
          entity_id: timer.cover_grace_period_bedroom
    - conditions:
      - condition: trigger
        id:
        - sleep
      sequence:
      - action: timer.cancel
        metadata: {}
        target:
          entity_id: timer.cover_grace_period_bedroom
        data: {}
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.sleeping
        data: {}
  mode: restart
- id: '1784142950714'
  alias: Toggle Remote Gaming
  description: ''
  triggers:
  - trigger: state
