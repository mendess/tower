- id: '1783412024155'
  alias: Animate Cover according to alarm events
  description: ''
  triggers:
  - trigger: event.received
    target:
      entity_id: event.sleep_as_android_alarm_clock
    options:
      event_type:
      - alert_start
    id: alarm started
    alias: Alarm Started
  - trigger: event.received
    target:
      entity_id: event.sleep_as_android_alarm_clock
    options:
      event_type:
      - alert_dismiss
