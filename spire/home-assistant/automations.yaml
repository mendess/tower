    metadata: {}
    data:
      message: There is a backup that has gone very stale
      title: Backup stale alert
  mode: single
- id: '1779702947947'
  alias: Turn off tv screen while working
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.oboro
    from:
    to:
    - 'on'
  - trigger: time_pattern
    hours: '*'
    minutes: /30
  conditions:
  - condition: switch.is_on
    target:
      entity_id: switch.aramathinewall_power_button
    options:
      behavior: any
      for: 00:00:00
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: binary_sensor.oboro
    state:
    - 'on'
  actions:
  - variables:
      gaming: '{{ is_state(''input_boolean.gaming_mode'', ''on'') }}'
      lunch_time: '{{ 11 < now().hour < 14 }}'
      after_work: '{{ now().hour > 17 }}'
      switch: '{{ gaming or lunch_time or after_work }}'
  - if:
    - condition: template
      value_template: '{{ switch }}'
    then:
    - action: switch.turn_on
      metadata: {}
      target:
        entity_id: switch.tv_screen_switch
      data: {}
    else:
    - condition: state
      state:
      - 'on'
      entity_id: switch.tv_screen_switch
    - action: script.notify_tv
      metadata: {}
      data:
        message: Turning off tv screen because you're working
    - delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
    - action: switch.turn_off
      metadata: {}
      target:
        entity_id: switch.tv_screen_switch
      data: {}
    - if:
      - condition: state
        entity_id: binary_sensor.aramanthinewall_source_is_live_tv
        state:
        - 'on'
      then:
      - action: switch.turn_off
        metadata: {}
        target:
          entity_id: switch.aramathinewall_power_button
        data: {}
      alias: turn off tv if watching the news
  mode: single
- id: '1781087126490'
  alias: Pilula alert
  description: ''
  triggers:
  - trigger: time
    at: '22:00:00'
    id: antibabypillen
  - trigger: time
    at: 08:00:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    id: heart
  - trigger: time
    at: 09:00:00
    id: heart
    weekday:
    - sun
    - sat
  - trigger: counter.maximum_reached
    target:
      entity_id: counter.antibabypillen_counter
    options:
      behavior: each
      for: 00:00:00
    id: counter reset
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - counter reset
    then:
    - action: counter.reset
      metadata: {}
      target:
        entity_id: counter.antibabypillen_counter
      data: {}
    - stop: done
    alias: Reset counter
  - alias: Increment Antibabypillen counter
    if:
    - condition: trigger
      id:
      - antibabypillen
    then:
    - action: counter.increment
      metadata: {}
      target:
        entity_id: counter.antibabypillen_counter
      data: {}
    - if:
      - condition: numeric_state
        entity_id: counter.antibabypillen_counter
        above: 21
      then:
      - stop: pill interval
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.antibabipillen
    data: {}
  mode: queued
  max: 10
- id: '1783362865967'
  alias: Update estores
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - automation.update_estores
    to:
    - 'on'
    alias: When this script is updated
  - trigger: state
    entity_id: sensor.sun_solar_azimuth
  - trigger: sun.elevation_changed
    options:
      threshold:
        type: any
  - trigger: state
    entity_id: binary_sensor.daylight
  - trigger: state
    entity_id: weather.braga
  - trigger: state
    entity_id: input_boolean.gaming_mode
  - trigger: state
    entity_id: binary_sensor.aramanthinewall_source_is_jellyfin
  - trigger: state
    entity_id: binary_sensor.oboro
  - trigger: state
    entity_id: switch.tolaria
  - trigger: state
    entity_id: input_boolean.sleeping
  - trigger: state
    entity_id: binary_sensor.varanda_aberta
  - trigger: state
    entity_id: input_boolean.privacy
  - trigger: state
    entity_id: input_boolean.desk_raised
  - trigger: timer.finished
    target:
      entity_id:
      - timer.cover_grace_period_bedroom
      - timer.cover_grace_period_study
      - timer.cover_grace_period_living_room
    options:
      behavior: each
      for: 00:00:00
  - trigger: timer.cancelled
    target:
      entity_id:
      - timer.cover_grace_period_bedroom
      - timer.cover_grace_period_study
      - timer.cover_grace_period_living_room
    options:
      for: 00:00:00
      behavior: each
  conditions: []
  actions:
  - action: automation.turn_off
    metadata: {}
    target:
      entity_id: automation.start_estores_grace_period
    data:
      stop_actions: true
  - variables:
      _entities: ''
      azimuth: '{{ int(states(''sensor.sun_solar_azimuth''), 0) }}'
      elevation: '{{ float(states("sensor.sun_solar_elevation"), 100.0) }}'
      daytime: '{{ is_state("binary_sensor.daylight", "on") }}'
      max_temp: '{{ float(states("sensor.max_temp"), 0) }}'
      cloudy: '{{ "cloudy" in states("weather.braga") }}'
      gaming: '{{ is_state(''input_boolean.gaming_mode'', ''on'') }}'
      watching: '{{ is_state(''binary_sensor.aramanthinewall_source_is_jellyfin'',
        ''on'') }}'
      oboro_on: '{{ is_state(''binary_sensor.oboro'', ''on'') }}'
      tolaria_on: '{{ is_state("switch.tolaria", "on") }}'
      tolaria_gaming: '{{ not gaming and tolaria_on }}'
      sleeping: '{{ is_state("input_boolean.sleeping", "on") }}'
      privacy: '{{ is_state("input_boolean.privacy", "on") }}'
      balcony_open: '{{ is_state("binary_sensor.varanda_aberta", "on") }}'
      desk_raised: '{{ is_state("input_boolean.desk_raised", "on") }}'
      _calc: ''
      lower_target: "{%- if max_temp < 27 %}\n  100\n{%- elif max_temp < 30 and cloudy
        %}\n  70\n{%- else %}\n  30\n{%- endif %}"
      _targets: ''
      daytime_target: '{{ 0 if not daytime else 100 }}'
      sleeping_target: '{{ 0 if sleeping else 100 }}'
      lower_east_target: '{{ iif(lower_target == 30, 0, lower_target) if azimuth <
        220 else 100 }}'
      lower_west_target: '{{ lower_target if 200 < azimuth else 100 }}'
      lower_south_target: '{{ lower_target if 100 < azimuth < 260 else 100 }}'
      _living_room: ''
      media_target: '{{ 0 if gaming or watching else 100 }}'
      privacy_target: '{{ 30 if privacy else 100 }}'
      _study: ''
      sun_blinded_target: '{{ 7 if azimuth > 200 and 5 < elevation < 25.0 else 100
        }}'
      desk_raised_target: '{{ 10 if desk_raised and (tolaria_gaming or oboro_on) else
        100 }}'
      working_target: '{{ 30 if oboro_on else 100 }}'
      desktop_gaming_target: '{{ 30 if tolaria_on and gaming else 100 }}'
      _overrides: ''
      doors_open_override: '{{ -100 if balcony_open else 100 }}'
      sunset_override: '{{ -70 if azimuth > 200 and elevation < 1 and daytime else
        100 }}'
      _positions: ''
      pos_varanda: "{{ min(\n  doors_open_override,\n  daytime_target,\n  sleeping_target,\n
        \ lower_east_target,\n  privacy_target,\n  media_target,\n) | abs }}"
      pos_tv_covers: '{{ pos_varanda }}'
      pos_bedroom_wc: "{{ min(\n  daytime_target,\n  sleeping_target,\n  lower_south_target,\n)
        | abs }}"
      pos_bedroom: "{{ min(\n  sunset_override,\n  daytime_target,\n  sleeping_target,\n
        \ lower_west_target,\n) | abs }}"
      pos_study: "{{ min(\n  pos_bedroom,\n  desk_raised_target, \n  sun_blinded_target,\n
        \ working_target,\n  desktop_gaming_target,\n) | abs }}"
      calculations:
      - entity: cover.estores_varanda
        lock: timer.cover_grace_period_living_room
        motors:
        - sensor.estores_varanda_direira_moving
        - sensor.estores_varanda_esquerda_moving
        position: '{{ pos_varanda }}'
      - entity: cover.estores_tv
        lock: timer.cover_grace_period_living_room
        motors:
        - sensor.estores_tv_moving
        position: '{{ pos_tv_covers }}'
      - entity: cover.estores_wc
        lock: timer.cover_grace_period_bedroom
        motors:
        - sensor.estores_wc_moving
        position: '{{ pos_bedroom_wc }}'
      - entity: cover.estores_quarto
        lock: timer.cover_grace_period_bedroom
        motors:
        - sensor.estores_quarto_moving
        position: '{{ pos_bedroom }}'
      - entity: cover.estores_escritorio
        lock: timer.cover_grace_period_study
        motors:
        - sensor.estores_escritorio_moving
        position: '{{ pos_study }}'
  - repeat:
      for_each: '{{ calculations }}'
      sequence:
      - if:
        - alias: Not at calculated position
          condition: template
          value_template: '{% set current_position = state_attr(repeat.item.entity,
            ''current_position'') %}

            {{ not (repeat.item.position - 1) < current_position < (repeat.item.position
            + 1) }}'
        - alias: grace period for this area not running
          condition: template
          value_template: '{{ is_state(repeat.item.lock, "idle") }}'
        then:
        - action: cover.set_cover_position
          metadata: {}
          target:
            entity_id: '{{ repeat.item.entity }}'
          data:
            position: '{{ repeat.item.position }}'
        - delay:
            hours: 0
            minutes: 0
            seconds: 1
            milliseconds: 0
        - alias: Wait for motors to stop
          wait_template: '{{ repeat.item.motors|map(''states'')|select("!=", "stop")|list
            == [] }}'
          timeout:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
  - action: automation.turn_on
    metadata: {}
    target:
      entity_id: automation.start_estores_grace_period
    data: {}
  mode: restart
- id: '1783363775126'
  alias: Toggle sleeping
