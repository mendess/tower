tv_sleep_timer:
  sequence:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.tv_screen_switch
    data: {}
  - action: timer.start
    metadata: {}
    target:
      entity_id: timer.sleep_timer
    data: {}
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - timer.sleep_timer
      to:
      - idle
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 40
      seconds: 0
      milliseconds: 0
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.aramathinewall_power_button
  alias: TV sleep timer
  description: ''
  icon: mdi:sleep
turn_on_tolaria_w_steam_if_tolaria_is_off:
  sequence:
  - if:
    - condition: state
      entity_id: switch.tolaria
      state:
      - 'off'
    then:
    - action: switch.turn_on
      metadata: {}
      target:
        entity_id: switch.tolaria
      data: {}
    else:
    - action: shell_command.tolaria_turn_on_steam
      metadata: {}
      data: {}
  alias: 'tolaria: start remote steam'
  description: ''
boot_to_source:
  sequence:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.aramathinewall_power_button
    data: {}
  - alias: wait for tv to turn on
    wait_template: '{{ is_state("switch.aramathinewall_power_button", "on") }}'
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.tv_screen_switch
    data: {}
  - parallel:
    - action: media_player.select_source
      metadata: {}
      data:
        source: '{{ source }}'
      target:
        device_id: b5098e373bea279a182da7c91e908c4f
    - if:
      - condition: template
        value_template: '{{ (volume | default(None)) is not none }}'
      then:
      - action: media_player.volume_set
        metadata: {}
        target:
          entity_id: media_player.aramanthinewall
        data:
          volume_level: '{{ (volume | default(0)) | float }}'
      alias: adjust volume
  - wait_template: '{{ is_state_attr("media_player.aramanthinewall", "source", source)
      }}'
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
    alias: wait for source to change to {{ source }}
  alias: Boot to source
  description: ''
  icon: mdi:import
  fields:
    source:
      selector:
        text: {}
    volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
  mode: restart
set_cover_position_with_grace_interval:
  sequence:
  - if:
    - condition: template
      value_template: '{% set current_position = state_attr(cover, ''current_position'')
        %}

        {{ (position - 5) < current_position < (position + 5) }}'
    then:
    - stop: too close to current position
    else:
    - action: cover.set_cover_position
      metadata: {}
      target:
        entity_id: '{{ cover }}'
      data:
        position: '{{ position }}'
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - repeat:
        for_each: '{{ motor }}'
        sequence:
        - wait_template: '{{ states(repeat.item) == "Stop" }}'
          timeout:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
  fields:
    position:
      selector:
        number:
          min: 1
          max: 100
    cover:
      selector:
        entity: {}
      name: cover
      required: true
    motor:
      selector:
        entity:
          multiple: true
  alias: Set cover position with grace interval
  description: ''
adjust_tv_volume:
  sequence:
  - variables:
      delay: '{{ step_delay or 1 }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ state_attr("media_player.aramanthinewall", "volume_level")
          > volume }}'
      sequence:
      - action: media_player.volume_down
        metadata: {}
        target:
          entity_id: media_player.aramanthinewall
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: '{{ iif(float(state_attr(''media_player.aramanthinewall'', ''volume_level''))
            < 0.26, delay, delay / 2) }}'
          milliseconds: 0
  - repeat:
      while:
      - condition: template
        value_template: '{{ state_attr("media_player.aramanthinewall", "volume_level")
          < volume }}'
      sequence:
      - action: media_player.volume_up
        metadata: {}
        target:
          entity_id: media_player.aramanthinewall
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: '{{ iif(float(state_attr(''media_player.aramanthinewall'', ''volume_level''))
            < 0.26, delay, delay / 2) }}'
          milliseconds: 0
  fields:
    volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.1
    step_delay:
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
      default: 1
  alias: Adjust TV Volume
  description: ''
